<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ตรวจสอบสลิป</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root { font-family: system-ui, -apple-system, sans-serif; color: #1f2937; background: #f7f9fa; }
      body { margin: 0; padding: 20px 16px 32px; } main { max-width: 520px; margin: auto; }
      h1 { margin: 4px 0 6px; font-size: 24px; } .intro { margin: 0 0 18px; color: #6b7280; }
      .card { background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px; box-shadow: 0 6px 24px #1f29370d; }
      .status { display: flex; gap: 12px; align-items: flex-start; padding: 13px; margin-bottom: 16px; border-radius: 12px; background: #f3f4f6; }
      .status-icon { width: 24px; height: 24px; flex: 0 0 24px; display: grid; place-items: center; border-radius: 50%; background: #9ca3af; color: white; font-size: 14px; }
      .status-copy { display: grid; gap: 2px; } .status-title { font-weight: 700; } .status-detail { color: #6b7280; font-size: 13px; }
      .status[data-state="uploading"], .status[data-state="processing"] { background: #ecfdf5; } .status[data-state="uploading"] .status-icon, .status[data-state="processing"] .status-icon { background: #06c755; animation: pulse 1.2s infinite; }
      .status[data-state="success"] { background: #ecfdf5; } .status[data-state="success"] .status-icon { background: #00b894; } .status[data-state="error"] { background: #fff1f2; } .status[data-state="error"] .status-icon { background: #e11d48; }
      @keyframes pulse { 50% { opacity: .45; } }
      label { display: block; margin: 14px 0 6px; font-weight: 600; } input, select { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 16px; background: white; }
      input:disabled, select:disabled { background: #f9fafb; } button { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 12px; background: #06c755; color: white; font-size: 16px; font-weight: 700; cursor: pointer; } button:disabled { opacity: .5; cursor: wait; }
      .secondary { background: #eef2f1; color: #166534; } #preview { width: 100%; max-height: 240px; margin-bottom: 4px; object-fit: contain; border-radius: 12px; background: #f7f9fa; } .visually-hidden { display: none; }
    </style>
  </head>
  <body><main>
    <h1>ตรวจสอบข้อมูลสลิป</h1><p class="intro">อัปโหลดสลิป แล้วตรวจสอบข้อมูลก่อนบันทึก</p>
    <div class="card">
      <div id="status" class="status" data-state="idle" role="status" aria-live="polite"><span id="status-icon" class="status-icon">i</span><span class="status-copy"><span id="status-title" class="status-title">พร้อมเริ่มต้น</span><span id="status-detail" class="status-detail">เลือกภาพสลิปจากอุปกรณ์ของคุณ</span></span></div>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" />
      <img id="preview" alt="ภาพสลิปตัวอย่าง" hidden />
      <form id="verify" hidden>
        <label for="type">ประเภท</label><select id="type"><option value="expense">รายจ่าย</option><option value="income">รายรับ</option></select>
        <label for="amount">จำนวนเงิน</label><input id="amount" type="number" min="0.01" step="0.01" required />
        <label for="payee_payer">ผู้รับ/ผู้โอน</label><input id="payee_payer" required />
        <label for="category">หมวดหมู่</label><select id="category" required><option>อาหารและเครื่องดื่ม</option><option>เดินทาง</option><option>ช้อปปิ้ง</option><option>บิลและสาธารณูปโภค</option><option>เงินเดือน/รายได้</option><option>โอนเงิน</option><option>อื่น ๆ</option></select>
        <label for="transaction_datetime">วันเวลา</label><input id="transaction_datetime" type="datetime-local" required />
        <button id="save" type="submit" disabled>บันทึกข้อมูล</button>
      </form>
      <button id="new-slip" class="secondary visually-hidden" type="button">เริ่มรายการใหม่</button>
    </div>
  </main><script src="/config.js"></script><script>
    const $ = (id) => document.getElementById(id);
    const config = window.APP_CONFIG || {};
    let lineAccessToken; let uploadId; let uploadInFlight = false; let saveInFlight = false;
    const required = ['amount', 'payee_payer', 'category', 'transaction_datetime'];
    const setStatus = (state, title, detail = '') => { $('status').dataset.state = state; $('status-icon').textContent = ({ idle: 'i', uploading: '↑', processing: '…', success: '✓', error: '!' })[state]; $('status-title').textContent = title; $('status-detail').textContent = detail; };
    const authHeaders = () => lineAccessToken ? { authorization: `Bearer ${lineAccessToken}` } : {};
    const syncSave = () => { $('save').disabled = saveInFlight || required.some((id) => !$(`${id}`).value.trim()); };
    const setFormDisabled = (disabled) => { $('file').disabled = disabled; ['type', 'amount', 'payee_payer', 'category', 'transaction_datetime'].forEach((id) => $(`${id}`).disabled = disabled); };
    const readPayload = async (response) => { try { return await response.json(); } catch { return {}; } };
    (async () => { if (!config.liffId || config.liffId.startsWith('replace-') || !window.liff) return; try { await window.liff.init({ liffId: config.liffId }); if (!window.liff.isLoggedIn()) { window.liff.login(); return; } lineAccessToken = window.liff.getAccessToken(); if (!lineAccessToken) throw new Error('ไม่พบ LINE access token'); } catch { setStatus('error', 'เข้าสู่ระบบ LINE ไม่สำเร็จ', 'กรุณาลองเปิดหน้านี้ใหม่'); } })();
    required.forEach((id) => $(`${id}`).addEventListener('input', syncSave));
    $('file').addEventListener('change', async (event) => { const file = event.target.files[0]; if (!file || uploadInFlight) return; uploadInFlight = true; setFormDisabled(true); setStatus('uploading', 'กำลังอัปโหลดภาพสลิป', 'กรุณารอสักครู่…'); const body = new FormData(); body.append('slip', file); try { const response = await fetch('/api/slips/extract', { method: 'POST', headers: authHeaders(), body }); const payload = await readPayload(response); if (!response.ok) throw new Error(payload.error || 'API ตอบกลับไม่สำเร็จ'); setStatus('processing', 'กำลังอ่านข้อมูลด้วย AI', 'กำลังเตรียมข้อมูลสำหรับตรวจสอบ'); uploadId = payload.upload_id; const data = payload.data; $('preview').src = URL.createObjectURL(file); $('preview').hidden = false; $('type').value = data.type; $('amount').value = data.amount; $('payee_payer').value = data.payee_payer; $('category').value = data.category; $('transaction_datetime').value = data.transaction_datetime.slice(0, 16); $('verify').hidden = false; setStatus('success', 'อ่านสลิปสำเร็จ', 'กรุณาตรวจสอบและแก้ไขข้อมูลก่อนบันทึก'); } catch (error) { uploadId = undefined; setStatus('error', 'อัปโหลดไม่สำเร็จ', error instanceof TypeError ? 'เกิดปัญหาเครือข่าย กรุณาตรวจสอบการเชื่อมต่อ' : error.message); } finally { uploadInFlight = false; setFormDisabled(false); syncSave(); } });
    $('verify').addEventListener('submit', async (event) => { event.preventDefault(); if (saveInFlight) return; syncSave(); if ($('save').disabled || !uploadId) return setStatus('error', 'ข้อมูลยังไม่พร้อมบันทึก', 'กรุณาอัปโหลดสลิปและกรอกข้อมูลสำคัญให้ครบ'); saveInFlight = true; $('save').textContent = 'กำลังบันทึก…'; setFormDisabled(true); syncSave(); try { const response = await fetch('/api/transactions', { method: 'POST', headers: { ...authHeaders(), 'content-type': 'application/json' }, body: JSON.stringify({ upload_id: uploadId, type: $('type').value, amount: Number($('amount').value), payee_payer: $('payee_payer').value, category: $('category').value, transaction_datetime: new Date($('transaction_datetime').value).toISOString() }) }); const payload = await readPayload(response); if (!response.ok) throw new Error(payload.errors?.map((e) => e.message).join(', ') || payload.error || 'API ตอบกลับไม่สำเร็จ'); setStatus('success', 'บันทึกข้อมูลสำเร็จ', 'รายการนี้ถูกบันทึกเรียบร้อยแล้ว'); $('verify').hidden = true; $('new-slip').classList.remove('visually-hidden'); } catch (error) { setStatus('error', 'บันทึกไม่สำเร็จ', error instanceof TypeError ? 'เกิดปัญหาเครือข่าย กรุณาลองใหม่' : error.message); } finally { saveInFlight = false; $('save').textContent = 'บันทึกข้อมูล'; setFormDisabled(false); syncSave(); } });
    $('new-slip').addEventListener('click', () => { uploadId = undefined; $('file').value = ''; $('preview').hidden = true; $('verify').hidden = true; $('new-slip').classList.add('visually-hidden'); setStatus('idle', 'พร้อมเริ่มต้น', 'เลือกภาพสลิปจากอุปกรณ์ของคุณ'); syncSave(); });
  </script></body>
</html>
